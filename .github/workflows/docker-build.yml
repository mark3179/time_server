name: Build and Push Docker Image

# 触发条件：
# 1. 推送到 master 分支
# 2. 推送以 v 开头的 tag（如 v1.0.0）
# 3. 在 Actions 页面手动点击“Run workflow”
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

# 工作流权限：允许读取仓库内容，允许写入 Packages（推镜像用）
permissions:
  contents: read
  packages: write

env:
  # GitHub Container Registry 地址
  REGISTRY: ghcr.io
  # 镜像名称，效果：ghcr.io/mark3179/time_server
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Docker Buildx（多平台/缓存支持）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到 GHCR。
      #    GitHub Actions 会自动提供 GITHUB_TOKEN，不需要你手动创建 PAT。
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 生成镜像标签：latest + 短 commit SHA + tag 名
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=tag

      # 5. 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用 GitHub Actions 缓存，加快下次构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max
